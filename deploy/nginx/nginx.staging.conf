worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 80M;

  # Docker DNS: proxy_pass con variable re-resuelve tras recreate de contenedores (evita 502)
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/ {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location /wana-media/ {
      set $minio_upstream http://minio:9000;
      proxy_pass $minio_upstream/wana-media/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  server {
    listen 80;
    server_name www.eleveri.app;
    return 301 https://eleveri.app$request_uri;
  }
}
