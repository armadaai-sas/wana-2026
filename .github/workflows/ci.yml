name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only

  validate-staging-env:
    name: Validate staging env template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create staging env from example
        run: |
          cp deploy/.env.staging.example .env.staging
          sed -i 's/change_me_jwt_min_32_chars/ci_staging_jwt_secret_min_32_chars_x/g' .env.staging
          sed -i 's/^POSTGRES_PASSWORD=change_me$/POSTGRES_PASSWORD=staging_pg_password_123/' .env.staging
          sed -i 's/change_me_minio/staging_minio_secret_123/g' .env.staging
      - run: STAGING=1 ./deploy/scripts/validate-env.sh
